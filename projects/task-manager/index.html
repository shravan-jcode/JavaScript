<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Task Manager</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <h1>JavaScript Task Manager</h1>

    <p>
        This project is for practicing JavaScript concepts.
    </p>

    <!-- =========================
         ADD TASK
    ========================== -->

    <section>
        <h2>Add Task</h2>

        <form id="taskForm">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter task"
            >

            <select id="priorityInput">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <button type="submit">
                Add Task
            </button>

        </form>
    </section>


    <!-- =========================
         CONTROLS
    ========================== -->

    <section>

        <h2>Controls</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks"
        >

        <select id="filterInput">

            <option value="all">
                All
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="pending">
                Pending
            </option>

        </select>

        <select id="sortInput">

            <option value="newest">
                Newest
            </option>

            <option value="oldest">
                Oldest
            </option>

            <option value="priority">
                Priority
            </option>

            <option value="alphabetical">
                Alphabetical
            </option>

        </select>

    </section>


    <!-- =========================
         STATISTICS
    ========================== -->

    <section>

        <h2>Statistics</h2>

        <p>
            Total:
            <span id="totalTasks">0</span>
        </p>

        <p>
            Completed:
            <span id="completedTasks">0</span>
        </p>

        <p>
            Pending:
            <span id="pendingTasks">0</span>
        </p>

        <p>
            Completion:
            <span id="completionPercentage">0%</span>
        </p>

    </section>


    <!-- =========================
         TASK LIST
    ========================== -->

    <section>

        <h2>Tasks</h2>

        <ul id="taskList"></ul>

    </section>


    <!-- =========================
         JAVASCRIPT CONCEPTS
    ========================== -->

    <section>

        <h2>JavaScript Practice</h2>

        <button id="scopeDemoButton">
            Run Scope Demo
        </button>

        <button id="closureDemoButton">
            Run Closure Demo
        </button>

        <button id="thisDemoButton">
            Run this Demo
        </button>

        <button id="eventLoopButton">
            Run Event Loop Demo
        </button>

        <button id="hoistingDemoButton">
            Run Hoisting Demo
        </button>

        <p id="demoOutput"></p>

    </section>


    <!--
        type="module" allows us to use
        import/export between JavaScript files.
    -->

    <script type="module" src="./js/app.js"></script>

</body>

</html>
